# HTTP VirtualHost (Redirects all traffic to HTTPS)
<VirtualHost *:80>
    ServerName localhost
    
    # 21. Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# HTTPS VirtualHost (Reverse Proxy to FastAPI)
<VirtualHost *:443>
    ServerName localhost
    
    # Enable SSL with Self-Signed Certificate
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key
    
    # 19. Enforce Strong SSL/TLS
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # 20. Block IP access (only allow if accessing via hostname)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^[0-9.]+$
    RewriteRule ^ - [F,L]

    # 15. Disable Open Proxy
    ProxyRequests Off
    ProxyPreserveHost On

    # Route all requests to the hidden FastAPI backend container
    ProxyPass / http://api:8000/
    ProxyPassReverse / http://api:8000/
</VirtualHost>
