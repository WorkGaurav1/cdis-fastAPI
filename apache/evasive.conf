<IfModule mod_evasive20.c>
    DOSHashTableSize    3097
    DOSPageCount        2
    DOSSiteCount        50
    DOSPageInterval     1
    DOSSiteInterval     1
    DOSBlockingPeriod   60
    # Directory for lock files (must be writable by www-data)
    DOSLogDir           "/var/log/mod_evasive"
</IfModule>
