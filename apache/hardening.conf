# 1. Disable Directory Listing
<Directory /var/www/>
    Options -Indexes
</Directory>

# 2. Disable TRACE Method
TraceEnable Off

# 3. Restrict HTTP Methods
<Location />
    <LimitExcept GET POST HEAD OPTIONS>
        Require all denied
    </LimitExcept>
</Location>

# 6. Disable Access to .ht* Files
<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

# 7. Limit Request Size to 10MB
LimitRequestBody 10485760

# 8. Configure Timeout
Timeout 60

# 11. Disable Server Signature
ServerSignature Off

# 12. Disable Server Tokens
ServerTokens Prod
