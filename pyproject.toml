[project]
name = "cdis-template-fastapi"
version = "0.1.0"
description = "CDIS Standard Template for FastAPI Applications"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.14",
    # Database Connector (Driver). If you switch to PostgreSQL, 
    # replace this with "psycopg2-binary>=2.9.0" or similar.
    "pymysql>=1.1.0",
    "slowapi>=0.1.9",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
# Tells Pyright to treat the "src" folder as a root for imports
extraPaths = ["src"]

# Tells Pyright where your virtual environment is located
venvPath = "."
venv = ".venv"
