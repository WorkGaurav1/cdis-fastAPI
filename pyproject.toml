[project]
name = "cdis-template-fastapi"
version = "0.1.0"
description = "CDIS Standard Template for FastAPI Applications"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.14",
    # Database Connector (Driver). If you switch to PostgreSQL, 
    # replace this with "psycopg2-binary>=2.9.0" or similar.
    "pymysql>=1.1.0",
    "slowapi>=0.1.9",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "pytest-env>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]

# Required Settings fields (DATABASE_URL, SECRET_KEY — see
# src/config/config.py) have no built-in default, so the test suite must
# supply its own values, the same way the Node backend's
# vitest.config.ts does for its equivalent required env vars. These are
# test-only and never used outside the suite.
[tool.pytest_env]
DATABASE_URL = "mysql+pymysql://test:test@localhost/test_unused"
SECRET_KEY = "test-only-secret-never-used-outside-the-test-suite"

[tool.pyright]
# Tells Pyright to treat the "src" folder as a root for imports
extraPaths = ["src"]

# Tells Pyright where your virtual environment is located
venvPath = "."
venv = ".venv"
