[build-system]
# Explicit, not strictly required today: `pip install --no-deps -e .` /
# `pip install --no-deps .` (Dockerfile, CI) both work via pip's implicit
# legacy-setuptools fallback when no [build-system] table is declared.
# Declaring it explicitly removes the dependency on that fallback ever
# staying implicit-default -- this project is an application, not a
# published package, so this is about install reproducibility, not
# packaging for PyPI.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdis-template-fastapi"
version = "0.1.0"
description = "CDIS Standard Template for FastAPI Applications"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.14",
    # Database Connector (Driver). If you switch to PostgreSQL, 
    # replace this with "psycopg2-binary>=2.9.0" or similar.
    "pymysql>=1.1.0",
    "slowapi>=0.1.9",
    "pyjwt>=2.8.0",
    # features/auth/security.py uses the bcrypt module directly, not
    # via passlib -- passlib was declared here but never actually
    # imported anywhere (dead dependency, only pulling this package in
    # transitively through its [bcrypt] extra).
    "bcrypt>=4.0.0",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "pytest-env>=1.0.0",
    "pytest-cov>=4.1.0",
    "pyright>=1.1.350",
    "pip-tools>=7.4.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Matches the Node backend's global floor (vitest.config.ts: 85%
# lines/statements/functions). Not chasing 100% for its own sake --
# actual coverage sits well above this (96% at the time this was set);
# the floor exists to catch a real regression, not to be grazed on
# purpose. Node also raises the bar to 95%/90% specifically for
# security-critical files; this project reaches that in practice
# (every features/auth/* file is 90-100% covered) without a second,
# more complex per-file threshold mechanism to maintain.
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# Required Settings fields (DATABASE_URL, SECRET_KEY — see
# src/config/config.py) have no built-in default, so the test suite must
# supply its own values, the same way the Node backend's
# vitest.config.ts does for its equivalent required env vars. These are
# test-only and never used outside the suite.
[tool.pytest_env]
# skip_if_set = "only set if not already present in the environment" --
# lets CI's integration-test job (TEST_DB_BACKEND=mysql,
# tests/conftest.py) point this at a real MySQL service container via a
# real DATABASE_URL env var, while every other run (no such var set)
# gets this harmless placeholder, satisfying Settings' fail-fast
# requirement without needing a real database at all in SQLite mode.
# (The "D:" prefix pytest-env docs mention is ini-linelist syntax only
# -- this [tool.pytest_env] TOML-table form needs the dict-value form
# instead, per pytest-env's own _parse_toml_config.)
DATABASE_URL = { value = "mysql+pymysql://test:test@localhost/test_unused", skip_if_set = true }
SECRET_KEY = "test-only-secret-never-used-outside-the-test-suite"
# Matches vitest.config.ts's NODE_ENV="test" -- keeps request logging
# quiet during the suite (utils/logging.py treats "test" the same as
# Node's "silent" log level) and exercises Settings' real "test" value
# rather than only ever testing against the "development" default.
ENVIRONMENT = "test"

[tool.pyright]
# Tells Pyright to treat the "src" folder as a root for imports
extraPaths = ["src"]

# No venvPath/venv here on purpose: this project has no .venv
# convention (README: dependencies install into whatever environment
# `pip install .[dev]` runs in -- a container, CI's runner, or your own
# venv under whatever name/location you chose). Point Pyright at
# dependencies with `pyright --pythonpath "$(command -v python)" src`
# instead (see justfile's `typecheck` recipe and lint-and-test.yml).

# Downgraded from the default "error" to "warning" (still visible in
# CI output, doesn't fail the gate) for exactly one recurring pattern:
# `__tablename__ = "some_string"` on every SQLModel table class.
# SQLAlchemy declares __tablename__'s type as `declared_attr`, but
# assigning a plain string there is the standard, correct SQLModel/
# SQLAlchemy declarative pattern -- Pyright's stubs just don't model
# this specific metaclass behavior (sqlalchemy/sqlalchemy#9750,
# fastapi/sqlmodel#189). One-off library-stub limitations elsewhere in
# the codebase are suppressed at the line, with a comment explaining
# why, rather than widening this to other report categories that are
# still broadly useful (e.g. reportArgumentType, reportOptionalMemberAccess).
reportAssignmentType = "warning"
